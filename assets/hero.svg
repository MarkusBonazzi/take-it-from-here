<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Take It From Here</title>
  <desc id="desc">A colorful banner showing context moving from a busy AI session into a clean new session.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="160" cy="80" r="120" fill="#8b5cf6" opacity=".15" filter="url(#glow)"/>
  <circle cx="1050" cy="350" r="150" fill="#0ea5e9" opacity=".18" filter="url(#glow)"/>

  <g opacity=".55" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round">
    <path d="M72 120h128"/>
    <path d="M72 150h92"/>
    <path d="M72 180h114"/>
    <path d="M72 210h76"/>
  </g>

  <g transform="translate(930 105)">
    <rect width="190" height="210" rx="20" fill="#fff" opacity=".96"/>
    <rect x="28" y="40" width="134" height="12" rx="6" fill="#38bdf8"/>
    <rect x="28" y="75" width="104" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="28" y="103" width="134" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="28" y="131" width="86" height="10" rx="5" fill="#cbd5e1"/>
    <circle cx="95" cy="175" r="16" fill="#22c55e"/>
    <path d="m87 175 6 6 11-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M250 210h160" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
  <path d="m390 190 26 20-26 20" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="165" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="750" text-anchor="middle">Take It From Here</text>
  <text x="600" y="225" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle">Fresh context. Same objective. The agent keeps going.</text>

  <g transform="translate(465 270)">
    <rect width="270" height="58" rx="29" fill="url(#flow)"/>
    <text x="135" y="38" fill="#0f172a" font-family="Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">$take-it-from-here</text>
  </g>

  <g fill="#fff" opacity=".25">
    <circle cx="410" cy="72" r="4"/>
    <circle cx="785" cy="90" r="5"/>
    <circle cx="850" cy="330" r="4"/>
    <circle cx="330" cy="345" r="5"/>
  </g>
</svg>
